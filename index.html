<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QA Daily Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  (function () {
    try {
      const stored = localStorage.getItem("qa-dashboard-theme");
      const wantsDark = stored === "dark" || (!stored && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (wantsDark) document.documentElement.setAttribute("data-theme", "dark");
    } catch (_) {}
  })();
</script>
<style>
  :root {
    /* Light theme: pure white background, neutral light-gray cards */
    --bg: #ffffff;
    --surface: #f4f5f7;
    --surface-alt: #e7e9ee;
    --ink: #1c2321;
    --ink-soft: #5e6764;
    --line: #d5d8de;
    --line-strong: #b0b5bb;
    --teal: #0f5257;
    --teal-soft: #d9ebeb;
    --green: #1f7a45;
    --green-soft: #dcf0e3;
    --red: #b23a2e;
    --red-soft: #f7e2df;
    --amber: #a5730e;
    --amber-soft: #f2e3c4;
    --modal-backdrop: rgba(28, 35, 33, 0.45);
    --shadow-panel: 0 24px 60px rgba(28, 35, 33, 0.22);
    --shadow-popover: 0 12px 32px rgba(28, 35, 33, 0.14);
    --row-hover: color-mix(in srgb, var(--teal) 5%, transparent);

    --chart-1: #0f5257;
    --chart-2: #b23a2e;
    --chart-3: #a5730e;
    --chart-4: #2e4a7a;
    --chart-5: #6e57a3;
    --chart-6: #3a7a2e;

    --font-display: "Space Grotesk", "Segoe UI", sans-serif;
    --font-body: "Inter", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "Courier New", monospace;
  }

  :root[data-theme="dark"] {
    --bg: #17191c;
    --surface: #21252a;
    --surface-alt: #262a30;
    --ink: #ece8dc;
    --ink-soft: #8b9297;
    --line: #33383e;
    --line-strong: #4a5058;
    --teal: #5ec1c1;
    --teal-soft: #1a2f31;
    --green: #6bce8b;
    --green-soft: #1c2f24;
    --red: #ff7d6c;
    --red-soft: #391f1c;
    --amber: #d9a94a;
    --amber-soft: #322818;
    --modal-backdrop: rgba(0, 0, 0, 0.6);
    --shadow-panel: 0 24px 60px rgba(0, 0, 0, 0.6);
    --shadow-popover: 0 12px 32px rgba(0, 0, 0, 0.5);
    --row-hover: color-mix(in srgb, var(--teal) 12%, transparent);

    --chart-1: #5ec1c1;
    --chart-2: #ff7d6c;
    --chart-3: #d9a94a;
    --chart-4: #7d9ee0;
    --chart-5: #b39ee0;
    --chart-6: #7fc85e;
  }

  * { box-sizing: border-box; }
  html, body { padding: 0; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  *:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .app-shell { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ---------- Masthead ---------- */
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;
    border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 28px; }
  .masthead-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); margin: 0 0 6px; }
  .masthead-title { font-family: var(--font-display); font-size: 32px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .masthead-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .masthead-meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); text-align: right; line-height: 1.6; }
  .masthead-actions { display: flex; gap: 8px; align-items: center; }

  .icon-btn { appearance: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px 7px 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: border-color .12s, color .12s; }
  .icon-btn:hover { border-color: var(--teal); color: var(--teal); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn[disabled] { opacity: .55; cursor: wait; }
  .icon-btn svg { display: block; }
  .icon-btn.is-icon-only { padding: 7px 10px; }
  .icon-btn.is-spinning svg { animation: spin 900ms linear infinite; transform-origin: center; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ---------- Filter row ---------- */
  .filter-row { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .filter-field { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .daterange-wrap { position: relative; }
  .daterange-trigger { appearance: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 14px; font-weight: 500; padding: 10px 14px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px; min-width: 260px; text-align: left; justify-content: space-between; }
  .daterange-trigger:hover, .daterange-trigger.is-open { border-color: var(--teal); }
  .daterange-trigger .trigger-content { display: inline-flex; align-items: center; gap: 10px; }
  .daterange-trigger .chevron { transition: transform .15s ease; color: var(--ink-soft); }
  .daterange-trigger.is-open .chevron { transform: rotate(180deg); }

  .daterange-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow-popover); display: flex; overflow: hidden; }
  .daterange-panel.is-hidden { display: none; }

  .daterange-quicklist { padding: 12px 0; border-right: 1px solid var(--line); min-width: 180px; background: var(--surface-alt); }
  .quicklist-heading { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 18px 4px; }
  .preset-btn { display: block; width: 100%; text-align: left; padding: 7px 18px; border: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; }
  .preset-btn:hover { background: var(--bg); }
  .preset-btn.is-active { background: color-mix(in srgb, var(--teal) 10%, transparent); border-left-color: var(--teal); color: var(--teal); font-weight: 600; }

  .daterange-calendar { padding: 16px 20px 12px; min-width: 340px; }
  .cal-caption { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 10px; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .cal-nav { appearance: none; background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px;
    cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .cal-nav:hover { border-color: var(--ink); }

  .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, 40px); }
  .cal-weekdays > div { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); text-align: center; padding: 6px 0; letter-spacing: .08em; }
  .cal-day { appearance: none; background: transparent; border: none; padding: 8px 0; font: inherit; font-family: var(--font-mono);
    font-size: 13px; color: var(--ink); cursor: pointer; position: relative; height: 34px; }
  .cal-day.is-adjacent { color: var(--ink-soft); opacity: .45; }
  .cal-day:hover:not(.is-range-start):not(.is-range-end) { background: var(--bg); }
  .cal-day.is-today::after { content: ''; position: absolute; bottom: 4px; left: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--teal); transform: translateX(-50%); }
  .cal-day.is-in-range { background: color-mix(in srgb, var(--teal) 18%, transparent); }
  .cal-day.is-range-start, .cal-day.is-range-end { background: var(--teal); color: #fff; font-weight: 600; }
  .cal-day.is-range-start.is-today::after, .cal-day.is-range-end.is-today::after { background: #fff; }
  .cal-day.is-range-start { border-radius: 6px 0 0 6px; }
  .cal-day.is-range-end { border-radius: 0 6px 6px 0; }
  .cal-day.is-range-single { border-radius: 6px; }

  .cal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); gap: 12px; }
  .cal-range-label { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .cal-clear-btn { appearance: none; background: transparent; border: none; color: var(--teal); font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .cal-clear-btn:hover { background: var(--teal-soft); }

  /* ---------- Summary cards ---------- */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 14px; align-items: stretch; margin-bottom: 36px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 96px; text-align: left;
    font-family: inherit; color: inherit; }
  .stat-card.is-clickable { cursor: pointer; transition: border-color .12s ease, transform .12s ease; }
  .stat-card.is-clickable:hover { border-color: var(--teal); transform: translateY(-1px); }
  .stat-card.is-clickable:active { transform: translateY(0); }
  .stat-card[disabled] { cursor: default; }
  .stat-card[disabled]:hover { border-color: var(--line); transform: none; }
  .stat-card-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .stat-card-hint { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); opacity: .7; letter-spacing: .05em; }
  .stat-card-value { font-family: var(--font-mono); font-size: 30px; font-weight: 600; line-height: 1; }
  .stat-card--approved .stat-card-value, .stat-card--approved .stat-card-rate { color: var(--green); }
  .stat-card--rejected .stat-card-value, .stat-card--rejected .stat-card-rate { color: var(--red); }
  .stat-card-rate { font-family: var(--font-mono); font-size: 14px; font-weight: 600; margin-top: 6px; }
  .stat-card-sub { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .stamp { --stamp-color: var(--green); width: 108px; height: 108px; border-radius: 50%; border: 3px double var(--stamp-color);
    color: var(--stamp-color); display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(-8deg); background: color-mix(in srgb, var(--stamp-color) 8%, transparent); flex-shrink: 0; }
  .stamp.is-low { --stamp-color: var(--red); }
  .stamp.is-mid { --stamp-color: var(--amber); }
  .stamp-eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .stamp-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stamp-caption { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; }

  /* ---------- Sections + tables ---------- */
  .section { margin-bottom: 36px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .section-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; }
  .section-note { font-size: 12.5px; color: var(--ink-soft); }

  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.ledger th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft);
    font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.ledger td { padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.ledger tbody tr:last-child td { border-bottom: none; }
  table.ledger tbody tr:hover td { background: var(--row-hover); }

  table.ledger th.num, table.ledger td.num { text-align: right; font-family: var(--font-mono); }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th.sortable .sort-arrow { display: inline-block; margin-left: 4px; font-size: 10px; color: var(--ink-soft); opacity: .4; }
  th.sortable.is-sorted .sort-arrow { opacity: 1; color: var(--teal); font-weight: 700; }
  th.sortable.is-sorted { color: var(--ink); }

  .num-btn { appearance: none; background: transparent; border: none; padding: 2px 6px; margin: -2px -6px;
    font: inherit; color: var(--teal); cursor: pointer; border-radius: 4px; font-weight: 500;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    transition: background-color .12s, text-decoration-color .12s; }
  .num-btn:hover { background: var(--teal-soft); text-decoration-color: var(--teal); }
  .num-zero { color: var(--ink-soft); }

  .rate-pill { display: inline-block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .rate-pill--high { background: var(--green-soft); color: var(--green); }
  .rate-pill--mid { background: var(--amber-soft); color: var(--amber); }
  .rate-pill--low { background: var(--red-soft); color: var(--red); }
  .rate-pill--none { background: var(--surface-alt); color: var(--ink-soft); }
  .rate-pill--rejection-high { background: var(--red-soft); color: var(--red); }
  .rate-pill--rejection-mid { background: var(--amber-soft); color: var(--amber); }
  .rate-pill--rejection-low { background: var(--green-soft); color: var(--green); }

  .copy-btn { appearance: none; border: 1px solid var(--teal); background: var(--teal); color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 7px; cursor: pointer; font-family: inherit; }
  .copy-btn:hover { filter: brightness(.9); }
  .copy-btn:active { transform: translateY(1px); }

  .state-banner { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 32px; text-align: center; color: var(--ink-soft); font-size: 14px; }
  .state-banner--error { border-color: var(--red); color: var(--red); background: var(--red-soft); }
  .muted-row td { color: var(--ink-soft); }

  /* ---------- Trend chart ---------- */
  .chart-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px 16px; }
  .chart-empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 40px 20px; }
  .chart-svg-wrap { width: 100%; overflow-x: auto; position: relative; }
  .trend-chart { width: 100%; height: auto; display: block; min-width: 720px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; justify-content: center; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .legend-total { font-family: var(--font-mono); color: var(--ink); font-weight: 600; font-size: 12.5px; margin-left: 4px; }
  .hover-overlay { cursor: crosshair; }

  /* Chart tooltip (custom hover, persistent element outside content) */
  .chart-tooltip {
    position: fixed; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; box-shadow: var(--shadow-popover); font-size: 12px;
    pointer-events: none; z-index: 200; min-width: 180px; max-width: 320px;
  }
  .chart-tooltip.is-hidden { display: none; }
  .tooltip-title { font-family: var(--font-mono); font-weight: 700; font-size: 11px; color: var(--teal); letter-spacing: .08em;
    margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-transform: uppercase; }
  .tooltip-body { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; align-items: center; }
  .tooltip-user { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tooltip-user-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .tooltip-value { text-align: right; font-weight: 700; color: var(--ink); font-family: var(--font-mono); font-size: 13px; }

  /* ---------- Modal (drill-down) ---------- */
  .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .modal.is-hidden { display: none; }
  .modal-backdrop { position: absolute; inset: 0; background: var(--modal-backdrop); backdrop-filter: blur(2px); }
  .modal-panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow-panel); width: min(1180px, 100%); max-height: calc(100vh - 64px);
    display: flex; flex-direction: column; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 20px 28px 16px; border-bottom: 1px solid var(--line); }
  .modal-title-block { min-width: 0; }
  .modal-eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin: 0 0 6px; }
  .modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .modal-meta { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .modal-close { appearance: none; background: transparent; border: 1px solid var(--line); border-radius: 8px;
    width: 34px; height: 34px; font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink-soft); flex-shrink: 0; }
  .modal-close:hover { border-color: var(--ink); color: var(--ink); }
  .modal-body { padding: 0 28px 24px; overflow: auto; }
  .modal-body table.ledger { font-size: 13px; }
  .modal-body table.ledger th, .modal-body table.ledger td { padding: 13px 18px; }
  .modal-body table.ledger th:first-child, .modal-body table.ledger td:first-child { padding-left: 4px; }
  .modal-body table.ledger th:last-child, .modal-body table.ledger td:last-child { padding-right: 4px; }
  .modal-body table.ledger th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .status-tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .status-tag--approved { background: var(--green-soft); color: var(--green); }
  .status-tag--rejected { background: var(--red-soft); color: var(--red); }
  .status-tag--other { background: var(--amber-soft); color: var(--amber); }
  .video-link { color: var(--teal); text-decoration: none; font-weight: 500; }
  .video-link:hover { text-decoration: underline; }
  .cell-reason { max-width: 260px; white-space: normal; color: var(--ink); }
  .cell-empty { color: var(--ink-soft); }
  .modal-empty { padding: 48px 24px; text-align: center; color: var(--ink-soft); font-size: 14px; }
  body.is-modal-open { overflow: hidden; }

  @media (max-width: 860px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .stamp { grid-column: span 2; justify-self: center; }
    .daterange-panel { flex-direction: column; }
    .daterange-quicklist { border-right: none; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 520px) {
    .summary-grid { grid-template-columns: 1fr; }
    .stamp { grid-column: span 1; }
    .masthead { flex-direction: column; align-items: flex-start; }
    .masthead-right { align-items: flex-start; }
    .masthead-meta { text-align: left; }
    .modal { padding: 12px; }
    .modal-panel { max-height: calc(100vh - 24px); }
    .modal-head { padding: 16px 18px 12px; }
    .modal-body { padding: 0 18px 18px; }
    .daterange-trigger { min-width: 0; width: 100%; }
    .cal-weekdays, .cal-days { grid-template-columns: repeat(7, 1fr); }
  }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <header class="masthead">
    <div>
      <p class="masthead-eyebrow">Video QC · QA Review</p>
      <h1 class="masthead-title">QA Daily Report</h1>
    </div>
    <div class="masthead-right">
      <div class="masthead-meta" id="masthead-meta">Loading…</div>
      <div class="masthead-actions">
        <button class="icon-btn" id="refresh-btn" type="button" title="Re-fetch the sheet">

<script>
// ============================================================================
// CONFIG
// ============================================================================
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQviNsOTXM2LlIs5ipLiil6Nox9r6BH2o-7-WtgLbTKDIltzZlHXxnlWYm7KkJLfr1JsDM69wyevuT/pub?output=csv";
const IST_TZ = "Asia/Kolkata";
const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
const TREND_WINDOW_DAYS = 15;
const TREND_TOP_USERS = 6;

// ============================================================================
// DATE UTILITIES
// ============================================================================
function istWallClockParts(nowUtc) {
  const shifted = new Date(nowUtc.getTime() + IST_OFFSET_MS);
  return {
    y: shifted.getUTCFullYear(),
    m: shifted.getUTCMonth(),
    d: shifted.getUTCDate(),
    weekday: (shifted.getUTCDay() + 6) % 7,
  };
}
function istMidnightUtc(y, m, d) { return new Date(Date.UTC(y, m, d, 0, 0, 0, 0) - IST_OFFSET_MS); }
function addDaysUtc(date, days) { return new Date(date.getTime() + days * 24 * 60 * 60 * 1000); }

const PRESETS = [
  { key: "allTime", group: "Quick select", label: "All time" },
  { key: "today", group: "Quick select", label: "Today" },
  { key: "yesterday", group: "Quick select", label: "Yesterday" },
  { key: "thisWeek", group: "Quick select", label: "This week" },
  { key: "lastWeek", group: "Quick select", label: "Last week" },
  { key: "thisMonth", group: "Months", label: "This month" },
  { key: "lastMonth", group: "Months", label: "Last month" },
  { key: "last30", group: "Months", label: "Last 30 days" },
  { key: "last90", group: "Months", label: "Last 90 days" },
];

function computePresetRange(key, nowUtc) {
  const { y, m, d, weekday } = istWallClockParts(nowUtc);
  const todayStart = istMidnightUtc(y, m, d);
  const tomorrowStart = addDaysUtc(todayStart, 1);
  switch (key) {
    case "allTime": return { start: null, end: null };
    case "today": return { start: todayStart, end: tomorrowStart };
    case "yesterday": return { start: addDaysUtc(todayStart, -1), end: todayStart };
    case "thisWeek": return { start: addDaysUtc(todayStart, -weekday), end: nowUtc };
    case "lastWeek": return { start: addDaysUtc(todayStart, -weekday - 7), end: addDaysUtc(todayStart, -weekday) };
    case "thisMonth": return { start: istMidnightUtc(y, m, 1), end: nowUtc };
    case "lastMonth": return { start: istMidnightUtc(y, m - 1, 1), end: istMidnightUtc(y, m, 1) };
    case "last30": return { start: addDaysUtc(todayStart, -30), end: nowUtc };
    case "last90": return { start: addDaysUtc(todayStart, -90), end: nowUtc };
  }
  return { start: null, end: null };
}

// ============================================================================
// AGGREGATION
// ============================================================================
function parseTimestamp(value) {
  if (!value || typeof value !== "string" || !value.trim()) return null;
  const dt = new Date(value.trim());
  return Number.isNaN(dt.getTime()) ? null : dt;
}
function norm(value) { return (value || "").toString().trim(); }
function reviewedRows(rows) {
  return rows.map((r) => ({ row: r, ts: parseTimestamp(r.qa_timestamp) })).filter((x) => x.ts !== null);
}
function inRange(ts, start, end) {
  if (start === null || end === null) return true;
  return ts >= start && ts < end;
}
function classify(qaStatus) {
  const s = norm(qaStatus).toLowerCase();
  if (s === "approved") return "approved";
  if (s === "rejected") return "rejected";
  return "other";
}
function qcUserKey(row) { return norm(row.qc_user_email_id || row.qc_user_id) || "(unknown QC user)"; }
function qaReviewerKey(row) { return norm(row.qa_reviewer) || "(unknown reviewer)"; }

function summarize(rowsWithTs) {
  let approved = 0, rejected = 0, other = 0;
  for (const { row } of rowsWithTs) {
    const bucket = classify(row.qa_status);
    if (bucket === "approved") approved++;
    else if (bucket === "rejected") rejected++;
    else other++;
  }
  const reviewed = rowsWithTs.length;
  const decided = approved + rejected;
  const approvalRate = decided > 0 ? (approved / decided) * 100 : null;
  const rejectionRate = decided > 0 ? (rejected / decided) * 100 : null;
  return { reviewed, approved, rejected, other, approvalRate, rejectionRate };
}

function groupByField(rowsWithTs, fieldGetter, fallbackLabel) {
  const map = new Map();
  for (const entry of rowsWithTs) {
    const key = norm(fieldGetter(entry.row)) || fallbackLabel;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(entry);
  }
  const groups = [];
  for (const [key, entries] of map.entries()) groups.push({ key, ...summarize(entries) });
  return groups;
}

function buildReport(reviewedRowsWithTs, range) {
  const inWindow = reviewedRowsWithTs.filter((x) => inRange(x.ts, range.start, range.end));
  const summary = summarize(inWindow);
  const byQcUser = groupByField(inWindow, qcUserKey, "(unknown QC user)");
  const byReviewer = groupByField(inWindow, qaReviewerKey, "(unknown reviewer)");
  return { label: range.label, summary, byQcUser, byReviewer, inWindow };
}

function filterInWindow(inWindow, { status, qcUser, qaReviewer } = {}) {
  return inWindow.filter(({ row }) => {
    if (status && classify(row.qa_status) !== status) return false;
    if (qcUser && qcUserKey(row) !== qcUser) return false;
    if (qaReviewer && qaReviewerKey(row) !== qaReviewer) return false;
    return true;
  });
}

// 15-day trend of daily reviewed count per QC user (top N).
function buildTrend(reviewedRowsWithTs, nowUtc) {
  const parts = istWallClockParts(nowUtc);
  const today = istMidnightUtc(parts.y, parts.m, parts.d);
  const days = [];
  for (let i = TREND_WINDOW_DAYS - 1; i >= 0; i--) days.push(addDaysUtc(today, -i));
  const windowStart = days[0];
  const windowEnd = addDaysUtc(today, 1);

  const dayMs = 24 * 60 * 60 * 1000;
  const userMap = new Map();
  for (const { row, ts } of reviewedRowsWithTs) {
    if (ts < windowStart || ts >= windowEnd) continue;
    const user = qcUserKey(row);
    if (!userMap.has(user)) userMap.set(user, new Array(TREND_WINDOW_DAYS).fill(0));
    const tp = istWallClockParts(ts);
    const rowMidnight = istMidnightUtc(tp.y, tp.m, tp.d);
    const dayIdx = Math.round((rowMidnight - windowStart) / dayMs);
    if (dayIdx >= 0 && dayIdx < TREND_WINDOW_DAYS) userMap.get(user)[dayIdx]++;
  }

  const users = [...userMap.entries()].map(([user, counts]) => ({
    user, counts, total: counts.reduce((a, b) => a + b, 0),
  }));
  users.sort((a, b) => b.total - a.total);
  const topUsers = users.slice(0, TREND_TOP_USERS);
  const maxValue = Math.max(1, ...topUsers.flatMap((u) => u.counts));
  return { days, users: topUsers, maxValue, totalUsers: users.length, hasData: topUsers.length > 0 };
}

// ============================================================================
// SORTING
// ============================================================================
// Nulls always sink to bottom regardless of direction.
function sortGroups(groups, column, dir) {
  const mult = dir === "asc" ? 1 : -1;
  return [...groups].sort((a, b) => {
    const av = a[column] == null ? null : a[column];
    const bv = b[column] == null ? null : b[column];
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    if (column === "key") return mult * String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
    return mult * (av - bv);
  });
}

function sortEntries(entries, column, dir) {
  const mult = dir === "asc" ? 1 : -1;
  const getVal = (e) => {
    switch (column) {
      case "ts": return e.ts.getTime();
      case "enterprise": return norm(e.row.enterprise_name).toLowerCase();
      case "vin": return norm(e.row.vin_name).toLowerCase();
      case "qcUser": return qcUserKey(e.row).toLowerCase();
      case "reviewer": return qaReviewerKey(e.row).toLowerCase();
      case "status": return classify(e.row.qa_status);
      case "reason": return norm(e.row.qa_reason).toLowerCase();
      default: return 0;
    }
  };
  return [...entries].sort((a, b) => {
    const av = getVal(a), bv = getVal(b);
    if (typeof av === "string" && typeof bv === "string") return mult * av.localeCompare(bv);
    return mult * (av - bv);
  });
}

// ============================================================================
// FORMATTING
// ============================================================================
function formatIST(date) {
  return new Intl.DateTimeFormat("en-IN", {
    timeZone: IST_TZ, day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: true,
  }).format(date) + " IST";
}
function formatISTShort(date) {
  return new Intl.DateTimeFormat("en-IN", {
    timeZone: IST_TZ, day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: true,
  }).format(date);
}
function formatDayIST(date) {
  return new Intl.DateTimeFormat("en-IN", { timeZone: IST_TZ, day: "2-digit", month: "short", year: "numeric" }).format(date);
}
function formatDayShort(date) {
  return new Intl.DateTimeFormat("en-IN", { timeZone: IST_TZ, day: "2-digit", month: "short" }).format(date);
}

function approvalBucket(rate) {
  if (rate === null || rate === undefined) return "none";
  if (rate >= 90) return "high";
  if (rate >= 75) return "mid";
  return "low";
}
// For rejection rate the color logic is inverted (low rejection = good = green).
function rejectionBucket(rate) {
  if (rate === null || rate === undefined) return "none";
  if (rate <= 10) return "rejection-low";  // good (green)
  if (rate <= 25) return "rejection-mid";  // caution (amber)
  return "rejection-high";                  // bad (red)
}
function formatRate(rate) { return (rate === null || rate === undefined) ? "—" : rate.toFixed(1) + "%"; }

function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function buildReportText(report) {
  const { label, summary, byQcUser } = report;
  const lines = [];
  lines.push(`QA Daily Report — ${label}`);
  lines.push(`Reviewed: ${summary.reviewed} | Approved: ${summary.approved} (${formatRate(summary.approvalRate)}) | Rejected: ${summary.rejected} (${formatRate(summary.rejectionRate)})` +
    (summary.other ? ` | Other: ${summary.other}` : ""));
  lines.push("");
  lines.push("QC User Breakdown:");
  if (byQcUser.length === 0) {
    lines.push("  (no videos reviewed in this period)");
  } else {
    for (const g of byQcUser) {
      lines.push(`  - ${g.key}: ${g.reviewed} reviewed, ${g.approved} approved (${formatRate(g.approvalRate)}), ${g.rejected} rejected (${formatRate(g.rejectionRate)})`);
    }
  }
  return lines.join("\n");
}

// ============================================================================
// STATE
// ============================================================================
let STATE = {
  reviewedRows: [],
  generatedAt: null,
  totalRows: 0,
  activeRange: { key: "today", label: "Today", start: null, end: null },
  picker: { open: false, viewMonth: null, pickStart: null, pickEnd: null },
  sort: {
    qcUser: { column: "reviewed", dir: "desc" },
    qaReviewer: { column: "reviewed", dir: "desc" },
  },
};

const MODAL_STATE = {
  rows: [],
  sort: { column: "ts", dir: "desc" },
  title: "",
  subtitle: "",
};

// ============================================================================
// THEME
// ============================================================================
function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
function setTheme(theme) {
  if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("qa-dashboard-theme", theme); } catch (_) {}
  renderThemeIcon();
}
function toggleTheme() { setTheme(currentTheme() === "dark" ? "light" : "dark"); }

const ICON_SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const ICON_MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function renderThemeIcon() {
  const el = document.getElementById("theme-icon");
  if (!el) return;
  el.innerHTML = currentTheme() === "dark" ? ICON_SUN : ICON_MOON;
}

// ============================================================================
// DATE RANGE PICKER
// ============================================================================
function openPicker() {
  const range = STATE.activeRange;
  const now = new Date();
  const anchor = range.key === "custom" && range.start ? range.start : now;
  const parts = istWallClockParts(anchor);
  STATE.picker.viewMonth = { y: parts.y, m: parts.m };
  if (range.key === "custom" && range.start && range.end) {
    STATE.picker.pickStart = range.start;
    STATE.picker.pickEnd = addDaysUtc(range.end, -1);
  } else {
    STATE.picker.pickStart = null;
    STATE.picker.pickEnd = null;
  }
  STATE.picker.open = true;
  renderPicker();
  document.getElementById("daterange-trigger").classList.add("is-open");
  document.getElementById("daterange-trigger").setAttribute("aria-expanded", "true");
  document.getElementById("daterange-panel").classList.remove("is-hidden");
}
function closePicker() {
  STATE.picker.open = false;
  document.getElementById("daterange-trigger").classList.remove("is-open");
  document.getElementById("daterange-trigger").setAttribute("aria-expanded", "false");
  document.getElementById("daterange-panel").classList.add("is-hidden");
}
function togglePicker() { STATE.picker.open ? closePicker() : openPicker(); }

function applyPreset(key) {
  const preset = PRESETS.find((p) => p.key === key);
  if (!preset) return;
  const range = computePresetRange(key, new Date());
  STATE.activeRange = { key, label: preset.label, start: range.start, end: range.end };
  closePicker();
  render();
}

function pickDay(cellDate) {
  const p = STATE.picker;
  if (!p.pickStart || (p.pickStart && p.pickEnd)) {
    p.pickStart = cellDate;
    p.pickEnd = null;
    renderPicker();
    return;
  }
  let start = p.pickStart, end = cellDate;
  if (end < start) { const t = start; start = end; end = t; }
  p.pickStart = start;
  p.pickEnd = end;
  applyCustomRange();
}
function applyCustomRange() {
  const { pickStart, pickEnd } = STATE.picker;
  if (!pickStart || !pickEnd) return;
  const endExclusive = addDaysUtc(pickEnd, 1);
  const label = `${formatDayIST(pickStart)} → ${formatDayIST(pickEnd)}`;
  STATE.activeRange = { key: "custom", label, start: pickStart, end: endExclusive };
  closePicker();
  render();
}
function navigateCalendar(deltaMonths) {
  const vm = STATE.picker.viewMonth;
  const nd = new Date(Date.UTC(vm.y, vm.m + deltaMonths, 1));
  STATE.picker.viewMonth = { y: nd.getUTCFullYear(), m: nd.getUTCMonth() };
  renderPicker();
}
function clearCustom() {
  STATE.picker.pickStart = null;
  STATE.picker.pickEnd = null;
  renderPicker();
}

function renderPicker() {
  const p = STATE.picker;
  if (!p.viewMonth) return;
  const { y, m } = p.viewMonth;
  const firstOfMonth = new Date(Date.UTC(y, m, 1));
  const firstWeekday = firstOfMonth.getUTCDay();
  const monthName = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" }).format(firstOfMonth);
  const todayParts = istWallClockParts(new Date());

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const dayOffset = i - firstWeekday;
    const cellUtc = new Date(Date.UTC(y, m, 1 + dayOffset));
    const cy = cellUtc.getUTCFullYear();
    const cm = cellUtc.getUTCMonth();
    const cd = cellUtc.getUTCDate();
    const midnight = istMidnightUtc(cy, cm, cd);
    const isAdjacent = cm !== m;
    const isToday = cy === todayParts.y && cm === todayParts.m && cd === todayParts.d;
    let rangeStart = false, rangeEnd = false, inRangeClass = "";
    if (p.pickStart && p.pickEnd) {
      if (midnight.getTime() === p.pickStart.getTime()) rangeStart = true;
      if (midnight.getTime() === p.pickEnd.getTime()) rangeEnd = true;
      if (midnight > p.pickStart && midnight < p.pickEnd) inRangeClass = " is-in-range";
    } else if (p.pickStart) {
      if (midnight.getTime() === p.pickStart.getTime()) rangeStart = true;
    }
    const singleDay = rangeStart && rangeEnd && p.pickStart && p.pickEnd && p.pickStart.getTime() === p.pickEnd.getTime();
    cells.push({ y: cy, m: cm, d: cd, midnight, adjacent: isAdjacent, today: isToday, rangeStart, rangeEnd, inRangeClass, singleDay });
  }

  const weekdaysHtml = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"].map((w) => `<div>${w}</div>`).join("");
  const daysHtml = cells.map((c) => {
    const classes = ["cal-day"];
    if (c.adjacent) classes.push("is-adjacent");
    if (c.today) classes.push("is-today");
    if (c.rangeStart) classes.push("is-range-start");
    if (c.rangeEnd) classes.push("is-range-end");
    if (c.singleDay) classes.push("is-range-single");
    if (c.inRangeClass) classes.push("is-in-range");
    return `<button type="button" class="${classes.join(" ")}" data-cal-day="${c.midnight.toISOString()}">${c.d}</button>`;
  }).join("");

  const activeKey = STATE.activeRange.key;
  const grouped = new Map();
  for (const preset of PRESETS) {
    if (!grouped.has(preset.group)) grouped.set(preset.group, []);
    grouped.get(preset.group).push(preset);
  }
  let presetsHtml = "";
  for (const [group, items] of grouped.entries()) {
    presetsHtml += `<div class="quicklist-heading">${escapeHtml(group)}</div>`;
    presetsHtml += items.map((it) =>
      `<button type="button" class="preset-btn ${it.key === activeKey ? "is-active" : ""}" data-preset="${it.key}">${escapeHtml(it.label)}</button>`
    ).join("");
  }
  presetsHtml += `<div class="quicklist-heading">Custom</div>`;
  presetsHtml += `<button type="button" class="preset-btn ${activeKey === "custom" ? "is-active" : ""}" data-preset-custom>Custom range</button>`;

  const rangeLabel = (p.pickStart && p.pickEnd)
    ? `${formatDayIST(p.pickStart)} → ${formatDayIST(p.pickEnd)}`
    : (p.pickStart ? `${formatDayIST(p.pickStart)} → …` : "Click a date, then click end");

  document.getElementById("daterange-panel").innerHTML = `
    <div class="daterange-quicklist">${presetsHtml}</div>
    <div class="daterange-calendar">
      <p class="cal-caption">Custom date range</p>
      <div class="cal-header">
        <button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Previous month">‹</button>
        <span class="cal-title">${escapeHtml(monthName)}</span>
        <button type="button" class="cal-nav" data-cal-nav="1" aria-label="Next month">›</button>
      </div>
      <div class="cal-weekdays">${weekdaysHtml}</div>
      <div class="cal-days">${daysHtml}</div>
      <div class="cal-footer">
        <span class="cal-range-label">${escapeHtml(rangeLabel)}</span>
        ${p.pickStart ? '<button type="button" class="cal-clear-btn" data-cal-clear>Clear</button>' : ""}
      </div>
    </div>
  `;
}

// ============================================================================
// TREND CHART
// ============================================================================
// Monotone cubic interpolation — smooth curves that don't overshoot the data
// (so lines never dip below zero even when a spike is followed by a valley).
function monotoneCubicPath(points) {
  const n = points.length;
  if (n === 0) return "";
  if (n === 1) return `M ${points[0][0]} ${points[0][1]}`;
  if (n === 2) return `M ${points[0][0]} ${points[0][1]} L ${points[1][0]} ${points[1][1]}`;

  const dx = new Array(n - 1);
  const slopes = new Array(n - 1);
  for (let i = 0; i < n - 1; i++) {
    dx[i] = points[i + 1][0] - points[i][0];
    slopes[i] = (points[i + 1][1] - points[i][1]) / dx[i];
  }
  const tangents = new Array(n);
  tangents[0] = slopes[0];
  tangents[n - 1] = slopes[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (slopes[i - 1] * slopes[i] <= 0) tangents[i] = 0;
    else tangents[i] = (slopes[i - 1] + slopes[i]) / 2;
  }
  // Enforce monotonicity (Fritsch-Carlson)
  for (let i = 0; i < n - 1; i++) {
    if (slopes[i] === 0) { tangents[i] = 0; tangents[i + 1] = 0; continue; }
    const a = tangents[i] / slopes[i];
    const b = tangents[i + 1] / slopes[i];
    const h = Math.hypot(a, b);
    if (h > 3) {
      const t = 3 / h;
      tangents[i] = t * a * slopes[i];
      tangents[i + 1] = t * b * slopes[i];
    }
  }
  let path = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;
  for (let i = 0; i < n - 1; i++) {
    const cp1x = points[i][0] + dx[i] / 3;
    const cp1y = points[i][1] + tangents[i] * dx[i] / 3;
    const cp2x = points[i + 1][0] - dx[i] / 3;
    const cp2y = points[i + 1][1] - tangents[i + 1] * dx[i] / 3;
    path += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${points[i + 1][0].toFixed(2)} ${points[i + 1][1].toFixed(2)}`;
  }
  return path;
}

// Chart layout constants — also used by the hover handler.
const CHART_W = 900;
const CHART_H = 360;
const CHART_PAD = { l: 44, r: 24, t: 28, b: 44 };

function renderTrendChart(trend) {
  if (!trend.hasData) {
    return `<div class="chart-panel chart-empty">No videos reviewed in the last ${TREND_WINDOW_DAYS} days.</div>`;
  }

  const { l: padL, r: padR, t: padT, b: padB } = CHART_PAD;
  const plotW = CHART_W - padL - padR;
  const plotH = CHART_H - padT - padB;

  const xForDay = (i) => padL + (trend.days.length === 1 ? plotW / 2 : (i / (trend.days.length - 1)) * plotW);
  const yForValue = (v) => padT + plotH - (v / trend.maxValue) * plotH;

  // Y-axis ticks (a "nice" step yielding ~5 lines).
  const rawMax = trend.maxValue;
  let step = 1;
  if (rawMax > 5) step = Math.ceil(rawMax / 5);
  const yTicks = [];
  for (let t = 0; t <= rawMax; t += step) yTicks.push(t);
  if (yTicks[yTicks.length - 1] < rawMax) yTicks.push(rawMax);

  let gridLines = "", yLabels = "";
  for (const t of yTicks) {
    const y = yForValue(t);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${CHART_W - padR}" y2="${y}" style="stroke: var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;
    yLabels += `<text x="${padL - 8}" y="${y + 3}" text-anchor="end" font-family="var(--font-mono)" font-size="10" style="fill: var(--ink-soft)">${t}</text>`;
  }

  const labelInterval = trend.days.length > 10 ? 2 : 1;
  let xLabels = "";
  trend.days.forEach((d, i) => {
    if (i % labelInterval !== 0 && i !== trend.days.length - 1) return;
    const label = formatDayShort(d);
    xLabels += `<text x="${xForDay(i)}" y="${padT + plotH + 20}" text-anchor="middle" font-family="var(--font-mono)" font-size="10" style="fill: var(--ink-soft)">${label}</text>`;
  });

  const baselineY = padT + plotH;
  const baseline = `<line x1="${padL}" y1="${baselineY}" x2="${CHART_W - padR}" y2="${baselineY}" style="stroke: var(--ink-soft)" stroke-width="1"/>`;

  // Area gradient for the top user's line — creates the "peak highlight" effect.
  let defs = "";
  if (trend.users.length > 0) {
    defs = `<defs><linearGradient id="chart-area-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color: var(--chart-1); stop-opacity: 0.22"/>
      <stop offset="100%" style="stop-color: var(--chart-1); stop-opacity: 0"/>
    </linearGradient></defs>`;
  }

  // Lines, area fill, dots, and value labels.
  let series = "";
  let valueLabels = "";
  trend.users.forEach((u, idx) => {
    const color = `var(--chart-${(idx % 6) + 1})`;
    const points = u.counts.map((c, i) => [xForDay(i), yForValue(c)]);
    const pathD = monotoneCubicPath(points);

    if (idx === 0) {
      const firstX = points[0][0].toFixed(2);
      const lastX = points[points.length - 1][0].toFixed(2);
      const areaD = pathD + ` L ${lastX} ${baselineY} L ${firstX} ${baselineY} Z`;
      series += `<path d="${areaD}" fill="url(#chart-area-top)" stroke="none"/>`;
    }

    series += `<path d="${pathD}" fill="none" style="stroke: ${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

    u.counts.forEach((c, i) => {
      const x = xForDay(i);
      const y = yForValue(c);
      series += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3" style="fill: ${color}; stroke: var(--surface)" stroke-width="1.5"/>`;
      // Value labels for non-zero points; flip below the dot if too close to the top edge.
      if (c > 0) {
        const labelY = (y - padT < 12) ? y + 14 : y - 8;
        valueLabels += `<text x="${x.toFixed(2)}" y="${labelY.toFixed(2)}" text-anchor="middle" style="fill: ${color}" font-family="var(--font-mono)" font-size="10.5" font-weight="700" pointer-events="none">${c}</text>`;
      }
    });
  });

  // Hover elements: dashed vertical guide, one enlarged dot per user, transparent overlay.
  const hoverGuide = `<line class="hover-guide" x1="0" y1="${padT}" x2="0" y2="${baselineY}" style="stroke: var(--ink); display: none" stroke-width="1" stroke-dasharray="3,3" pointer-events="none"/>`;
  const hoverDots = trend.users.map((_, idx) => {
    const color = `var(--chart-${(idx % 6) + 1})`;
    return `<circle class="hover-dot" data-user-idx="${idx}" cx="0" cy="0" r="5" style="fill: ${color}; stroke: var(--surface); display: none" stroke-width="2" pointer-events="none"/>`;
  }).join("");
  const hoverOverlay = `<rect class="hover-overlay" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>`;

  const svg = `<svg viewBox="0 0 ${CHART_W} ${CHART_H}" preserveAspectRatio="xMidYMid meet" class="trend-chart" role="img" aria-label="Day-on-day trend of reviewed videos per QC user">
    ${defs}
    ${gridLines}
    ${baseline}
    ${xLabels}
    ${yLabels}
    ${series}
    ${valueLabels}
    ${hoverGuide}
    ${hoverDots}
    ${hoverOverlay}
  </svg>`;

  const legend = trend.users.map((u, idx) => {
    const color = `var(--chart-${(idx % 6) + 1})`;
    return `<span class="legend-item"><span class="legend-dot" style="background:${color}"></span>${escapeHtml(u.user)}<span class="legend-total">${u.total}</span></span>`;
  }).join("");

  const moreUsersNote = trend.totalUsers > TREND_TOP_USERS
    ? `<span class="section-note">showing top ${TREND_TOP_USERS} of ${trend.totalUsers}</span>` : "";

  return `
    <div class="chart-panel">
      <div class="chart-svg-wrap">${svg}</div>
      <div class="chart-legend">${legend}</div>
      ${moreUsersNote}
    </div>
  `;
}

// Attaches hover interactivity to the trend chart after it's rendered.
function attachTrendChartListeners() {
  if (!CURRENT_TREND || !CURRENT_TREND.hasData) return;
  const svg = document.querySelector(".trend-chart");
  if (!svg) return;
  const overlay = svg.querySelector(".hover-overlay");
  const guide = svg.querySelector(".hover-guide");
  const hoverDots = svg.querySelectorAll(".hover-dot");
  const tooltip = document.getElementById("chart-tooltip");
  if (!overlay || !guide || !tooltip) return;

  const trend = CURRENT_TREND;
  const { l: padL, r: padR, t: padT, b: padB } = CHART_PAD;
  const plotW = CHART_W - padL - padR;
  const plotH = CHART_H - padT - padB;
  const xForDay = (i) => padL + (trend.days.length === 1 ? plotW / 2 : (i / (trend.days.length - 1)) * plotW);
  const yForValue = (v) => padT + plotH - (v / trend.maxValue) * plotH;

  overlay.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    const scaleX = CHART_W / rect.width;
    const svgX = (e.clientX - rect.left) * scaleX;

    let closestIdx = 0;
    let closestDist = Infinity;
    for (let i = 0; i < trend.days.length; i++) {
      const d = Math.abs(xForDay(i) - svgX);
      if (d < closestDist) { closestDist = d; closestIdx = i; }
    }

    const guideX = xForDay(closestIdx);
    guide.setAttribute("x1", guideX);
    guide.setAttribute("x2", guideX);
    guide.style.display = "block";

    hoverDots.forEach((dot, idx) => {
      const u = trend.users[idx];
      if (!u) return;
      dot.setAttribute("cx", guideX);
      dot.setAttribute("cy", yForValue(u.counts[closestIdx]));
      dot.style.display = "block";
    });

    const dateLabel = formatDayShort(trend.days[closestIdx]);
    let body = "";
    trend.users.forEach((u, idx) => {
      const color = `var(--chart-${(idx % 6) + 1})`;
      body += `<span class="tooltip-user"><span class="tooltip-user-dot" style="background:${color}"></span>${escapeHtml(u.user)}</span><span class="tooltip-value">${u.counts[closestIdx]}</span>`;
    });
    tooltip.innerHTML = `<div class="tooltip-title">${escapeHtml(dateLabel)}</div><div class="tooltip-body">${body}</div>`;
    tooltip.classList.remove("is-hidden");

    // Position after content is set so we can measure.
    const guideScreenX = rect.left + (guideX / CHART_W) * rect.width;
    const ttRect = tooltip.getBoundingClientRect();
    const margin = 12;
    let leftX = guideScreenX + 14; // default: to the right of guide
    if (leftX + ttRect.width > window.innerWidth - margin) {
      leftX = guideScreenX - ttRect.width - 14; // flip to left side
    }
    if (leftX < margin) leftX = margin;
    let topY = rect.top + padT * (rect.height / CHART_H);
    if (topY + ttRect.height > window.innerHeight - margin) {
      topY = window.innerHeight - ttRect.height - margin;
    }
    if (topY < margin) topY = margin;
    tooltip.style.left = `${leftX}px`;
    tooltip.style.top = `${topY}px`;
  });

  overlay.addEventListener("mouseleave", () => {
    tooltip.classList.add("is-hidden");
    guide.style.display = "none";
    hoverDots.forEach((d) => (d.style.display = "none"));
  });
}

// ============================================================================
// BREAKDOWN TABLE (with sort)
// ============================================================================
function sortHeader(label, column, sortState, tableKey, numeric) {
  const isActive = sortState.column === column;
  const arrow = isActive ? (sortState.dir === "asc" ? "↑" : "↓") : "↕";
  const classes = ["sortable"];
  if (numeric) classes.push("num");
  if (isActive) classes.push("is-sorted");
  return `<th class="${classes.join(" ")}" data-sort="${tableKey}:${column}" role="button" tabindex="0" aria-sort="${isActive ? (sortState.dir === "asc" ? "ascending" : "descending") : "none"}">
    <span class="sort-label">${label}</span><span class="sort-arrow">${arrow}</span>
  </th>`;
}

function numCell(count, drill) {
  if (count === 0) return `<td class="num"><span class="num-zero">0</span></td>`;
  const attrs = Object.entries(drill).map(([k, v]) => `data-${k}="${escapeHtml(v)}"`).join(" ");
  return `<td class="num"><button class="num-btn" ${attrs}>${count}</button></td>`;
}

function ratePillCell(rate, kind) {
  const bucket = kind === "approval" ? approvalBucket(rate) : rejectionBucket(rate);
  const cls = kind === "approval" ? `rate-pill--${bucket}` : `rate-pill--${bucket}`;
  return `<td class="num"><span class="rate-pill ${cls}">${formatRate(rate)}</span></td>`;
}

function renderBreakdownTable(groups, headLabel, keyDrillAttr, tableKey) {
  const sortState = STATE.sort[tableKey];
  const sorted = sortGroups(groups, sortState.column, sortState.dir);

  if (sorted.length === 0) {
    return `<div class="table-wrap"><table class="ledger"><thead><tr>
      <th>${headLabel}</th>
      <th class="num">Reviewed</th><th class="num">Approved</th><th class="num">Rejected</th>
      <th class="num">Approval</th><th class="num">Rejection</th>
    </tr></thead><tbody><tr class="muted-row"><td colspan="6">No videos reviewed in this period.</td></tr></tbody></table></div>`;
  }

  const headers = [
    sortHeader(headLabel, "key", sortState, tableKey, false),
    sortHeader("Reviewed", "reviewed", sortState, tableKey, true),
    sortHeader("Approved", "approved", sortState, tableKey, true),
    sortHeader("Rejected", "rejected", sortState, tableKey, true),
    sortHeader("Approval", "approvalRate", sortState, tableKey, true),
    sortHeader("Rejection", "rejectionRate", sortState, tableKey, true),
  ].join("");

  const rows = sorted.map((g) => `<tr>
    <td>${escapeHtml(g.key)}</td>
    ${numCell(g.reviewed, { drill: "group-reviewed", "group-type": keyDrillAttr, key: g.key })}
    ${numCell(g.approved, { drill: "group-approved", "group-type": keyDrillAttr, key: g.key })}
    ${numCell(g.rejected, { drill: "group-rejected", "group-type": keyDrillAttr, key: g.key })}
    ${ratePillCell(g.approvalRate, "approval")}
    ${ratePillCell(g.rejectionRate, "rejection")}
  </tr>`).join("");

  return `<div class="table-wrap"><table class="ledger"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function handleSortClick(spec) {
  const [tableKey, column] = spec.split(":");
  const currentSort = STATE.sort[tableKey];
  if (!currentSort) return;
  if (currentSort.column === column) {
    currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
  } else {
    currentSort.column = column;
    // Text columns default to asc, numbers to desc.
    currentSort.dir = column === "key" ? "asc" : "desc";
  }
  render();
}

function updateTriggerLabel() { document.getElementById("daterange-label").textContent = STATE.activeRange.label; }

let CURRENT_REPORT = null;
let CURRENT_TREND = null;

  const otherDisabled = s.other === 0 ? "disabled" : "";

        <p class="stat-card-value">${s.approved}</p>
        ${approvedRate}
      </button>
      <button type="button" class="stat-card stat-card--rejected is-clickable" data-drill="card-rejected">
        <p class="stat-card-label">Rejected <span class="stat-card-hint">view →</span></p>
        <p class="stat-card-value">${s.rejected}</p>
        ${rejectedRate}
      </button>
      <button type="button" class="stat-card ${s.other > 0 ? "is-clickable" : ""}" data-drill="card-other" ${otherDisabled}>
        <p class="stat-card-label">QC Users Involved ${s.other > 0 ? '<span class="stat-card-hint">view other →</span>' : ''}</p>
        <p class="stat-card-value">${report.byQcUser.length}</p>
        ${otherHint}
      </button>
      <div class="stamp is-${approvalBucket(s.approvalRate)}">

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">QA Reviewer Breakdown</h2>
        <span class="section-note">Who on the QA team reviewed these videos</span>
      </div>
      ${renderBreakdownTable(report.byReviewer, "QA Reviewer", "qa-reviewer", "qaReviewer")}
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Day-on-Day Trend</h2>

// ============================================================================
// DRILL-DOWN MODAL (with sort)
// ============================================================================
function openDrilldown({ title, subtitle, rows }) {
  MODAL_STATE.rows = rows;
  MODAL_STATE.title = title;
  MODAL_STATE.subtitle = subtitle;
  MODAL_STATE.sort = { column: "ts", dir: "desc" };

  document.getElementById("modal-eyebrow").textContent = STATE.activeRange.label;
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-meta").textContent = subtitle;

  renderModalBody();
  document.getElementById("modal").classList.remove("is-hidden");
  document.body.classList.add("is-modal-open");
}

function renderModalBody() {
  const body = document.getElementById("modal-body");
  const { rows, sort } = MODAL_STATE;

  if (rows.length === 0) {
    body.innerHTML = `<div class="modal-empty">No videos match this selection.</div>`;
    return;
  }

  const sortedRows = sortEntries(rows, sort.column, sort.dir);

  const modalSortHeader = (label, col) => {
    const isActive = sort.column === col;
    const arrow = isActive ? (sort.dir === "asc" ? "↑" : "↓") : "↕";
    return `<th class="sortable ${isActive ? "is-sorted" : ""}" data-modal-sort="${col}" role="button" tabindex="0" aria-sort="${isActive ? (sort.dir === "asc" ? "ascending" : "descending") : "none"}">
      <span class="sort-label">${label}</span><span class="sort-arrow">${arrow}</span></th>`;
  };

  const trs = sortedRows.map(({ row, ts }) => {
    const status = classify(row.qa_status);
    const statusLabel = norm(row.qa_status) || "—";
    const reason = norm(row.qa_reason);
    const videoUrl = norm(row.video_url);
    const videoCell = videoUrl
      ? `<a class="video-link" href="${escapeHtml(videoUrl)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`
      : `<span class="cell-empty">—</span>`;
    return `<tr>
      <td>${escapeHtml(formatISTShort(ts))}</td>
      <td>${escapeHtml(norm(row.enterprise_name) || "—")}</td>
      <td>${escapeHtml(norm(row.vin_name) || "—")}</td>
      <td>${escapeHtml(qcUserKey(row))}</td>
      <td>${escapeHtml(qaReviewerKey(row))}</td>
      <td><span class="status-tag status-tag--${status}">${escapeHtml(statusLabel)}</span></td>
      <td class="cell-reason">${reason ? escapeHtml(reason) : '<span class="cell-empty">—</span>'}</td>
      <td>${videoCell}</td>
    </tr>`;
  }).join("");

  body.innerHTML = `<table class="ledger">
    <thead><tr>
      ${modalSortHeader("Reviewed at (IST)", "ts")}
      ${modalSortHeader("Enterprise", "enterprise")}
      ${modalSortHeader("VIN", "vin")}
      ${modalSortHeader("QC User", "qcUser")}
      ${modalSortHeader("QA Reviewer", "reviewer")}
      ${modalSortHeader("Status", "status")}
      ${modalSortHeader("Reason", "reason")}
      <th>Video</th>
    </tr></thead>
    <tbody>${trs}</tbody>
  </table>`;
}

function handleModalSort(column) {
  if (MODAL_STATE.sort.column === column) {
    MODAL_STATE.sort.dir = MODAL_STATE.sort.dir === "asc" ? "desc" : "asc";
  } else {
    MODAL_STATE.sort.column = column;
    MODAL_STATE.sort.dir = column === "ts" ? "desc" : "asc";
  }
  renderModalBody();
}

function closeDrilldown() {
  document.getElementById("modal").classList.add("is-hidden");
  document.body.classList.remove("is-modal-open");
}

function handleDrill(drill, dataset) {
  const report = CURRENT_REPORT;
  if (!report) return;
  const inWindow = report.inWindow;
  const periodLabel = report.label;

  if (drill === "card-reviewed") return openDrilldown({ title: "All reviewed videos", subtitle: `${periodLabel} · ${inWindow.length} videos`, rows: inWindow });
  if (drill === "card-approved") { const rows = filterInWindow(inWindow, { status: "approved" }); return openDrilldown({ title: "Approved videos", subtitle: `${periodLabel} · ${rows.length} videos`, rows }); }
  if (drill === "card-rejected") { const rows = filterInWindow(inWindow, { status: "rejected" }); return openDrilldown({ title: "Rejected videos", subtitle: `${periodLabel} · ${rows.length} videos`, rows }); }
  if (drill === "card-other") { const rows = filterInWindow(inWindow, { status: "other" }); return openDrilldown({ title: "Videos with other status", subtitle: `${periodLabel} · ${rows.length} videos`, rows }); }

  const groupType = dataset.groupType;
  const key = dataset.key;
  const groupField = groupType === "qc-user" ? "qcUser" : "qaReviewer";
  const groupLabel = groupType === "qc-user" ? "QC User" : "QA Reviewer";

  if (drill === "group-reviewed") { const rows = filterInWindow(inWindow, { [groupField]: key }); return openDrilldown({ title: "Reviewed videos", subtitle: `${periodLabel} · ${groupLabel}: ${key} · ${rows.length} videos`, rows }); }
  if (drill === "group-approved") { const rows = filterInWindow(inWindow, { [groupField]: key, status: "approved" }); return openDrilldown({ title: "Approved videos", subtitle: `${periodLabel} · ${groupLabel}: ${key} · ${rows.length} videos`, rows }); }
  if (drill === "group-rejected") { const rows = filterInWindow(inWindow, { [groupField]: key, status: "rejected" }); return openDrilldown({ title: "Rejected videos", subtitle: `${periodLabel} · ${groupLabel}: ${key} · ${rows.length} videos`, rows }); }
}

// ============================================================================
// EVENTS
// ============================================================================
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-modal-close]")) { closeDrilldown(); return; }

  if (e.target.closest("#refresh-btn")) { loadDashboard({ isRefresh: true }); return; }
  if (e.target.closest("#theme-btn")) { toggleTheme(); return; }
  if (e.target.closest("#copy-btn")) { handleCopy(); return; }

  if (e.target.closest("#daterange-trigger")) { togglePicker(); return; }

  const presetBtn = e.target.closest("[data-preset]");
  if (presetBtn) { applyPreset(presetBtn.dataset.preset); return; }
  if (e.target.closest("[data-preset-custom]")) return;
  const navBtn = e.target.closest("[data-cal-nav]");
  if (navBtn) { navigateCalendar(parseInt(navBtn.dataset.calNav, 10)); return; }
  const dayBtn = e.target.closest("[data-cal-day]");
  if (dayBtn) { pickDay(new Date(dayBtn.dataset.calDay)); return; }
  if (e.target.closest("[data-cal-clear]")) { clearCustom(); return; }

  const modalSortEl = e.target.closest("[data-modal-sort]");
  if (modalSortEl) { handleModalSort(modalSortEl.dataset.modalSort); return; }

  const sortEl = e.target.closest("[data-sort]");
  if (sortEl) { handleSortClick(sortEl.dataset.sort); return; }

  if (STATE.picker.open && !e.target.closest("#daterange-panel") && !e.target.closest("#daterange-trigger")) {
    closePicker();
  }

  const drillEl = e.target.closest("[data-drill]");
  if (drillEl && !drillEl.disabled) { handleDrill(drillEl.dataset.drill, drillEl.dataset); return; }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!document.getElementById("modal").classList.contains("is-hidden")) { closeDrilldown(); return; }
    if (STATE.picker.open) { closePicker(); return; }
  }
  // Space/Enter on sort headers
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-sort], [data-modal-sort]")) {
    e.preventDefault();
    if (e.target.dataset.modalSort) handleModalSort(e.target.dataset.modalSort);
    else if (e.target.dataset.sort) handleSortClick(e.target.dataset.sort);
  }
});

function handleCopy() {
  const report = CURRENT_REPORT;
  if (!report) return;
  const text = buildReportText(report);
  const btn = document.getElementById("copy-btn");
  navigator.clipboard.writeText(text).then(
    () => {
      const original = btn.textContent;
      btn.textContent = "Copied ✓";
      setTimeout(() => { btn.textContent = original; }, 1800);
    },
    () => { alert("Couldn't copy automatically. Select the report text manually."); }
  );
}

// ============================================================================
// LOAD / REFRESH
// ============================================================================
function showError(message) {
  document.getElementById("content").innerHTML =
    `<div class="state-banner state-banner--error">Couldn't load the dashboard: ${escapeHtml(message)}</div>`;
}

async function loadDashboard({ isRefresh = false } = {}) {
  const refreshBtn = document.getElementById("refresh-btn");
  const refreshLabel = refreshBtn.querySelector(".refresh-label");
  refreshBtn.disabled = true;
  refreshBtn.classList.add("is-spinning");
  refreshLabel.textContent = isRefresh ? "Refreshing…" : "Loading…";

  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`Sheet fetch failed: ${res.status} ${res.statusText}`);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    const rows = parsed.data;

    STATE.reviewedRows = reviewedRows(rows);
    STATE.generatedAt = new Date();
    STATE.totalRows = rows.length;

    if (STATE.activeRange.key !== "custom") {
      const range = computePresetRange(STATE.activeRange.key, new Date());
      STATE.activeRange = { ...STATE.activeRange, start: range.start, end: range.end };
    }

    render();
  } catch (err) {
    console.error(err);
    showError(err.message + (err.message.toLowerCase().includes("fetch") ? " — if this is a CORS error, try re-publishing the sheet or hosting behind a small proxy." : ""));
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.classList.remove("is-spinning");
    refreshLabel.textContent = "Refresh";
  }
}

// ============================================================================
// INIT
// ============================================================================
renderThemeIcon();
loadDashboard();
</script>
